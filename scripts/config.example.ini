# Example Configuration File
# Copy this to config.ini and update with your actual values

[database]
# MySQL database connection settings
host = localhost
port = 3306
database = wkz_dev
username = root 
password = password

[report]
# Report date range (YYYY-MM-DD format)
start_date = 2026-07-01
end_date = 2026-07-31

[output]
# Output settings
output_directory = reports
filename_prefix = health_center_report

[email]
# Email settings for sending reports
smtp_server = smtp.gmail.com
smtp_port = 587
sender_email = your_email@gmail.com
sender_password = your_app_password_here
recipient_email = recipient@example.com
send_email = yes
