# Example Configuration File
# Copy this to config.ini and update with your actual values

[database]
# MySQL database connection settings
host = localhost
port = 3306
database = hospital_db
username = db_user
password = db_password

[report]
# Report date range (YYYY-MM-DD format)
start_date = 2024-12-02
end_date = 2025-01-23

[output]
# Output settings
output_directory = reports
filename_prefix = hospital_report
